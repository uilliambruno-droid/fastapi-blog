services:
  - type: web
    name: fastapi-blog
    plan: free
    runtime: python
    buildCommand: poetry install --only main
    startCommand: poetry run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /posts/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: POETRY_VERSION
        value: 2.1.3
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_ENABLED
        value: true